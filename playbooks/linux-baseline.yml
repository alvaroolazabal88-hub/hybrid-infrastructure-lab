---
- name: Linux baseline
  hosts: linux
  become: true
  tasks:
    - name: Ensure tree is installed
      ansible.builtin.apt:
        name: tree
        state: present
        update_cache: true

    - name: Disable SSH password authentication
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/10-hardening.conf
        content: |
          PasswordAuthentication no
        owner: root
        group: root
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s
      notify: Reload ssh

  handlers:
    - name: Reload ssh
      ansible.builtin.service:
        name: ssh
        state: reloaded